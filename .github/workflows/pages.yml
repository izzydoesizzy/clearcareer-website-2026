name: Deploy to GitHub Pages

# Deploys the repository as-is (plain HTML) to GitHub Pages on every push to main.
# One-time setup in the GitHub UI: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# The default GITHUB_TOKEN cannot enable Pages by itself, so that single click is required once.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Verify the built artifacts are committed
        run: |
          test -f index.html
          test -f site/index.html
          test -f plan/marketing-plan.html
          test -f emails/index.html
          echo "ok"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
